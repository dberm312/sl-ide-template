# Audit the deck and print the PDF on every push and pull request. On a push,
# the PDF is committed back to the branch under pdf/, so the copy in the repo
# is always the latest build. Local builds go to output/, which is gitignored.
name: Deck PDF

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run, so two runs never race to commit.
concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-24.04 # pinned: the Chrome sandbox step below is 24.04-specific
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pdffonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # needs, so headless Chrome exits before rendering anything.
      - name: Allow Chrome sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          for b in chromium chromium-browser google-chrome; do
            p=$(command -v "$b") && echo "$b -> $p ($("$p" --version 2>&1 | head -1))" || true
          done

      - run: pnpm install --frozen-lockfile

      - name: Audit (every page must read ok)
        run: pnpm run audit

      - name: Print PDF
        run: OUT_DIR=pdf pnpm run pdf

      # Every embedded font must be self-hosted; anything else is a fallback
      # for a glyph the subsets lack.
      - name: Check fonts
        run: scripts/check-fonts.sh pdf/*.pdf

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit PDF to the branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "Update deck PDF for ${GITHUB_SHA::7}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
