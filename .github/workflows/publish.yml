# On every push: audit the deck, build it, print the PDF, check its fonts,
# and publish that version to sl-ide cloud. main updates sl-ide.com/d/<slug>/;
# any other branch gets its own preview at sl-ide.com/d/<slug>/b/<branch>/.
#
# Needs sl-ide.config.json (slug, team, visibility) and the repo secret
# SL_IDE_PUBLISH_TOKEN. `pnpm new-project` sets up both. Without them the
# deck is still audited and printed, and the publish step is skipped.
name: Publish deck

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push supersedes an older run of the same branch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04 # pinned: the Chrome sandbox step below is 24.04-specific
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pdffonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # needs, so headless Chrome exits before rendering anything.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile

      - name: Audit (every page must read ok)
        run: pnpm run audit

      - name: Print PDF
        run: pnpm run pdf

      - name: Check fonts
        run: scripts/check-fonts.sh

      - name: Publish to sl-ide cloud
        env:
          SL_IDE_PUBLISH_TOKEN: ${{ secrets.SL_IDE_PUBLISH_TOKEN }}
        run: |
          if [[ ! -f sl-ide.config.json ]]; then
            echo "::notice::No sl-ide.config.json, so not publishing. pnpm new-project sets one up."
          elif [[ -z "$SL_IDE_PUBLISH_TOKEN" ]]; then
            echo "::warning::sl-ide.config.json is set but the SL_IDE_PUBLISH_TOKEN secret is missing: gh secret set SL_IDE_PUBLISH_TOKEN"
          else
            pnpm run publish-deck
          fi
