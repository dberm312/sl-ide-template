# On every push: audit the layout, print the PDF, check its fonts, and publish
# that version to sl-ide cloud. main updates app.sl-ide.com/d/<slug>/;
# any other branch gets its own preview at app.sl-ide.com/d/<slug>/r/<encoded-branch>/,
# and its open PR carries one comment with the link (scripts/preview-comment.mjs),
# posted when the PR opens and updated on each push.
#
# Needs sl-ide.config.json (slug, team) and the repo secret
# SL_IDE_PUBLISH_TOKEN. `pnpm new-project` sets up both. Without them the
# deck is still printed, and the publish step is skipped.
name: Publish deck

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

# A newer push supersedes an older run of the same branch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04 # pinned: the Chrome sandbox step below is 24.04-specific
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # needs, so headless Chrome exits before rendering anything.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Chrome's first launch on a fresh runner takes ~9s, nearly all of it
      # reading the browser off disk. Pay that in the background while Node
      # and the dependencies install, so printing finds it warm.
      - name: Warm up Chrome
        run: nohup google-chrome --headless --disable-gpu --dump-dom about:blank >/dev/null 2>&1 &

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Node's corepack fetches the pnpm that packageManager names in about a
      # second; pnpm/action-setup took five. No dependency cache: there are
      # only four, and restoring one takes as long as installing them.
      - name: Enable pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - run: pnpm install --frozen-lockfile

      # The gate: a clipped, spilling or wordy page fails the run before
      # anything is printed or published. The pre-commit hook can be skipped
      # or missing and audits the working tree; this audits the pushed commit.
      - name: Audit the layout
        run: pnpm run audit

      - name: Print PDF
        run: pnpm run pdf

      - name: Check fonts
        run: scripts/check-fonts.sh

      - name: Publish to sl-ide cloud
        id: publish
        env:
          SL_IDE_PUBLISH_TOKEN: ${{ secrets.SL_IDE_PUBLISH_TOKEN }}
        run: |
          if [[ ! -f sl-ide.config.json ]]; then
            echo "::notice::No sl-ide.config.json, so not publishing. pnpm new-project sets one up."
          elif [[ -z "$SL_IDE_PUBLISH_TOKEN" ]]; then
            echo "::warning::sl-ide.config.json is set but the SL_IDE_PUBLISH_TOKEN secret is missing: gh secret set SL_IDE_PUBLISH_TOKEN"
          else
            pnpm run publish-deck
          fi

      - name: Update the PR's preview comment
        if: steps.publish.outputs.version && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-comment.mjs published "$GITHUB_REF_NAME" "${{ steps.publish.outputs.version }}"

  # A new PR gets the branch's link straight away, before its next push.
  # PRs from forks can't comment (read-only token) and never publish.
  link:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-comment.mjs opened "${{ github.event.pull_request.number }}"
